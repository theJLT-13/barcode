<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today's Barcode</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f5f6f8; color: #18202b; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 640px); padding: 32px 20px; background: white; border: 1px solid #e5e7eb; border-radius: 16px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
    #date { margin: 0 0 24px; color: #667085; font-size: 14px; }
    svg { display: block; max-width: 100%; height: auto; margin: 0 auto; background: white; }
    #code { margin: 16px 0 0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: clamp(14px, 4vw, 20px); letter-spacing: .04em; overflow-wrap: anywhere; }
    #error { color: #a32121; font-size: 14px; }
    [hidden] { display: none !important; }
    @media screen and (max-width: 640px) {
      body { align-items: start; padding: 16px; }
    }
    @media print { body { background: white; padding: 0; } main { border: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>Today's barcode</h1>
    <p id="date"></p>
    <svg id="barcode" role="img" aria-label="Today's Code 128 barcode"></svg>
    <p id="code" aria-live="polite"></p>
    <p id="error" role="alert" hidden>Unable to load the barcode library. Check your internet connection and reload this page.</p>
    <noscript><p>Enable JavaScript to display today's barcode.</p></noscript>
  </main>
  <!-- Pinned CDN version; this single HTML file needs an internet connection. -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
  <script>
    (() => {
      const dateFormatter = new Intl.DateTimeFormat('en-AU', {
        timeZone: 'Australia/Sydney', day: '2-digit', month: '2-digit', year: '2-digit'
      });
      const displayFormatter = new Intl.DateTimeFormat('en-AU', {
        timeZone: 'Australia/Sydney', day: 'numeric', month: 'long', year: 'numeric'
      });
      let previousCode = '';

      function updateBarcode() {
        const now = new Date();
        const parts = Object.fromEntries(dateFormatter.formatToParts(now).map(part => [part.type, part.value]));
        const code = `563325073285902${parts.day}${parts.month}${parts.year}0`;
        if (code === previousCode) return;
        document.getElementById('code').textContent = code;
        document.getElementById('date').textContent = `${displayFormatter.format(now)} · Sydney`;
        const barcode = document.getElementById('barcode');
        barcode.setAttribute('aria-label', `Code 128 barcode: ${code}`);
        try {
          JsBarcode(barcode, code, {
            format: 'CODE128', width: 2, height: 110,
            displayValue: false, margin: 24, background: '#ffffff', lineColor: '#000000'
          });
          previousCode = code;
          document.getElementById('error').hidden = true;
        } catch (error) {
          barcode.hidden = true;
          document.getElementById('error').hidden = false;
        }
      }

      updateBarcode();
      // Refresh after Sydney midnight, including when returning to an open tab.
      setInterval(updateBarcode, 1000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) updateBarcode();
      });
      window.addEventListener('pageshow', updateBarcode);
    })();
  </script>
</body>
</html>
